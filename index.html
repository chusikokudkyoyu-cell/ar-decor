<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>空間デコAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: two columns on desktop (settings left, live 3D preview right); one column on phones with the preview first */
:root{
  --paper:#eef1f6;
  --surface:#ffffff;
  --ink:#1b2236;
  --muted:#5d6782;
  --line:#d5dbe7;
  --indigo:#2f3f9e;
  --indigo-soft:#e3e7fb;
  --vermilion:#e2553a;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;gap:24px}
header{display:grid;gap:6px}
header h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.4vw,44px);line-height:1.2;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}.viewer{order:-1}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:22px}
.step{display:grid;gap:10px}
.step h2{margin:0;font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;
  padding:12px 10px;font:700 15px var(--body);cursor:pointer;display:grid;gap:2px;text-align:left}
.seg button small{font-weight:500;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--indigo);background:var(--indigo-soft)}
.designs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.designs button{appearance:none;border:1.5px solid var(--line);border-radius:10px;padding:4px;background:var(--surface);cursor:pointer;display:grid;gap:4px}
.designs button[aria-pressed="true"]{border-color:var(--indigo);box-shadow:0 0 0 2px var(--indigo-soft)}
.designs canvas,.designs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;background:var(--paper)}
.designs span{font-size:11px;color:var(--muted)}
.upload{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.upload label{border:1.5px dashed var(--indigo);color:var(--indigo);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.size{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.size label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.size input{width:100%;font:700 18px var(--body);padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;color:var(--ink);background:var(--surface);font-variant-numeric:tabular-nums}
.size .x{padding-bottom:10px;color:var(--muted)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 11px;font:500 12px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
button:focus-visible,input:focus-visible,label:focus-visible{outline:3px solid var(--vermilion);outline-offset:2px}

.viewer{display:grid;gap:12px;position:sticky;top:16px}
@media (max-width:820px){.viewer{position:static}}
model-viewer{width:100%;height:min(68vh,620px);min-height:360px;background:linear-gradient(#f7f8fb,#e4e8f1);border-radius:14px;border:1px solid var(--line);--poster-color:transparent}
.ar-btn{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);appearance:none;border:0;border-radius:999px;
  background:var(--vermilion);color:#fff;font:700 17px var(--body);padding:14px 30px;cursor:pointer;box-shadow:0 6px 18px rgba(226,85,58,.35);white-space:nowrap}
.dims{position:absolute;left:14px;top:12px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.dims b{color:var(--ink)}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.note strong{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ghost{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font:700 13px var(--body);cursor:pointer}
.qr{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}
.qr svg{width:96px;height:96px;flex:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>空間デコAR</h1>
    <p>床シートやタペストリーを、実際のサイズのまま部屋や会場に置いて見られます。スマホでこのページを開き、「ARで置いてみる」を押して床や壁にカメラを向けてください。</p>
  </header>

  <div class="grid">
    <section class="panel" aria-label="設定">
      <div class="step">
        <h2>1. 置くもの</h2>
        <div class="seg" id="kindSeg">
          <button data-v="floor" aria-pressed="true">床シート<small>床に貼る</small></button>
          <button data-v="tapestry" aria-pressed="false">タペストリー<small>壁に掛ける</small></button>
        </div>
      </div>

      <div class="step">
        <h2>2. デザイン</h2>
        <div class="designs" id="designs"></div>
        <div class="upload">
          <label for="upload" tabindex="0">画像を読み込む</label>
          <input type="file" id="upload" accept="image/*" hidden>
          <span>入稿データ（PNG / JPG）をそのまま使えます</span>
        </div>
      </div>

      <div class="step">
        <h2>3. 実寸サイズ</h2>
        <div class="size">
          <label for="wcm">幅 (cm)<input type="number" id="wcm" min="10" max="1000" value="180"></label>
          <span class="x">×</span>
          <label for="hcm">高さ (cm)<input type="number" id="hcm" min="10" max="1000" value="120"></label>
        </div>
        <div class="presets" id="presets"></div>
        <label class="check" for="lock"><input type="checkbox" id="lock" checked> 画像の縦横比に合わせる</label>
      </div>
    </section>

    <section class="viewer" aria-label="プレビュー">
      <div style="position:relative">
        <model-viewer id="mv" camera-controls touch-action="pan-y" shadow-intensity="0.6" exposure="1.05"
          ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
          camera-orbit="0deg 55deg auto" environment-image="neutral" alt="床シートの3Dプレビュー">
          <button slot="ar-button" class="ar-btn">ARで置いてみる</button>
        </model-viewer>
        <div class="dims">実寸 <b id="dimText">180 × 120 cm</b></div>
      </div>
      <div class="note" id="arNote">
        <strong>このPCではプレビューのみです</strong>
        スマホ（iPhone / Android）でこのページを開くと、赤いボタンからARで置けます。ドラッグで回転、ホイールで拡大できます。
      </div>
      <div class="qr" id="qrBox" hidden>
        <div id="qr"></div>
        <div><strong style="color:var(--ink)">スマホで開く</strong><br>カメラアプリでこのQRコードを読み取ってください。</div>
      </div>
      <div class="row">
        <button class="ghost" id="saveGlb">3Dデータ (.glb) を保存</button>
      </div>
    </section>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

const $ = id => document.getElementById(id);
const mv = $("mv");

/* ---------- sample designs (original, drawn in code) ---------- */
const JP = '"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif';
const SAMPLES = {
  floor: [
    { name:"青海波ようこそ", draw(c,w,h){
        c.fillStyle="#1f2f86"; c.fillRect(0,0,w,h);
        const r = Math.min(w,h)/9;
        for(let row=-1; row*r*.5 < h+r; row++){
          for(let col=-1; col*r*2 < w+r*2; col++){
            const x = col*r*2 + (row%2?r:0), y = row*r*.5;
            for(let k=4;k>0;k--){ c.beginPath(); c.arc(x,y+r,r*k/4,Math.PI,0); c.closePath();
              c.fillStyle = k%2 ? "#2f45b8" : "#1f2f86"; c.fill(); c.strokeStyle="#e9edff"; c.lineWidth=r*.04; c.stroke(); }
          }
        }
        const R = Math.min(w,h)*.32;
        c.fillStyle="#fbfaf6"; c.beginPath(); c.arc(w/2,h/2,R,0,Math.PI*2); c.fill();
        c.strokeStyle="#e2553a"; c.lineWidth=R*.05; c.beginPath(); c.arc(w/2,h/2,R*.9,0,Math.PI*2); c.stroke();
        c.fillStyle="#1f2f86"; c.textAlign="center"; c.textBaseline="middle";
        c.font=`900 ${R*.42}px ${JP}`; c.fillText("ようこそ", w/2, h/2-R*.12);
        c.font=`700 ${R*.17}px ${JP}`; c.fillText("WELCOME", w/2, h/2+R*.32);
    }},
    { name:"足あと誘導", draw(c,w,h){
        c.fillStyle="#f3efe6"; c.fillRect(0,0,w,h);
        c.fillStyle="#ffd23f"; c.fillRect(0,h*.36,w,h*.28);
        const step = w/7, s = h*.07;
        for(let i=0;i<6;i++){
          const x = step*(i+.6), y = h/2 + (i%2? -h*.06 : h*.06);
          c.save(); c.translate(x,y); c.rotate(Math.PI/2); c.fillStyle="#2a2a2a";
          c.beginPath(); c.ellipse(0,s*.3,s*.55,s*.9,0,0,Math.PI*2); c.fill();
          for(let t=0;t<5;t++){ c.beginPath(); c.arc(-s*.45+t*s*.23, -s*.85 + Math.abs(t-1.5)*s*.08, s*.13,0,Math.PI*2); c.fill(); }
          c.restore();
        }
        c.fillStyle="#e2553a"; c.beginPath(); c.moveTo(w*.9,h/2); c.lineTo(w*.82,h*.38); c.lineTo(w*.82,h*.62); c.closePath(); c.fill();
        c.fillStyle="#2a2a2a"; c.textAlign="left"; c.textBaseline="alphabetic";
        c.font=`900 ${h*.13}px ${JP}`; c.fillText("受付はこちら", w*.05, h*.26);
        c.font=`700 ${h*.06}px ${JP}`; c.fillText("RECEPTION →", w*.05, h*.86);
    }},
    { name:"タイル", draw(c,w,h){
        const n = 8, t = Math.min(w,h)/n;
        const pal = ["#2f3f9e","#e2553a","#f5c84b","#f3efe6","#3a9a8b"];
        for(let y=0;y<h;y+=t) for(let x=0;x<w;x+=t){
          const i = Math.floor(x/t)+Math.floor(y/t)*3;
          c.fillStyle = pal[i%pal.length]; c.fillRect(x,y,t,t);
          c.fillStyle = pal[(i+2)%pal.length];
          c.beginPath(); c.arc(x+(i%2?0:t), y+(i%3?0:t), t*.9, 0, Math.PI*2); c.fill();
        }
    }},
  ],
  tapestry: [
    { name:"秋の感謝祭", draw(c,w,h){
        const g = c.createLinearGradient(0,0,0,h); g.addColorStop(0,"#f7e3c4"); g.addColorStop(1,"#efc58f");
        c.fillStyle=g; c.fillRect(0,0,w,h);
        c.fillStyle="#d9442b"; c.beginPath(); c.arc(w/2,h*.36,w*.33,0,Math.PI*2); c.fill();
        c.fillStyle="#1d2440"; c.textAlign="center"; c.textBaseline="middle";
        c.font=`900 ${w*.22}px ${JP}`; c.fillText("秋", w/2, h*.36);
        c.font=`900 ${w*.12}px ${JP}`; c.fillText("感謝祭", w/2, h*.68);
        c.font=`700 ${w*.055}px ${JP}`; c.fillText("AUTUMN FAIR 2026", w/2, h*.78);
        c.fillStyle="#1d2440"; c.fillRect(w*.1,h*.86,w*.8,h*.006);
        c.font=`500 ${w*.045}px ${JP}`; c.fillText("11.3 SAT ─ 11.4 SUN", w/2, h*.91);
    }},
    { name:"カラーブロック", draw(c,w,h){
        c.fillStyle="#f6f3ec"; c.fillRect(0,0,w,h);
        const blocks=[["#2f3f9e",0,0,.62,.4],["#e2553a",.62,0,.38,.62],["#f5c84b",0,.4,.38,.34],["#3a9a8b",.38,.62,.62,.38]];
        for(const [col,x,y,bw,bh] of blocks){ c.fillStyle=col; c.fillRect(x*w,y*h,bw*w,bh*h); }
        c.fillStyle="#f6f3ec"; c.beginPath(); c.arc(w*.62,h*.4,w*.16,0,Math.PI*2); c.fill();
        c.fillStyle="#1b2236"; c.textAlign="left"; c.font=`900 ${w*.1}px ${JP}`; c.fillText("OPEN", w*.06, h*.92);
    }},
    { name:"のれん風", draw(c,w,h){
        c.fillStyle="#22306e"; c.fillRect(0,0,w,h);
        c.strokeStyle="rgba(255,255,255,.12)"; c.lineWidth=w*.004;
        for(let x=w/3;x<w;x+=w/3){ c.beginPath(); c.moveTo(x,h*.35); c.lineTo(x,h); c.stroke(); }
        c.fillStyle="#fbfaf6"; c.beginPath(); c.arc(w/2,h*.3,w*.2,0,Math.PI*2); c.fill();
        c.fillStyle="#22306e"; c.textAlign="center"; c.textBaseline="middle"; c.font=`900 ${w*.2}px ${JP}`; c.fillText("和", w/2, h*.31);
        c.fillStyle="#fbfaf6"; c.font=`700 ${w*.075}px ${JP}`;
        ["い","ら","っ","し","ゃ","い"].forEach((ch,i)=>c.fillText(ch, w/2, h*.57 + i*w*.085));
    }},
  ]
};
const PRESETS = {
  floor: [[180,120],[120,90],[90,60],[300,200]],
  tapestry: [[60,90],[45,120],[90,180],[30,60]]
};

/* ---------- state ---------- */
const S = { kind:"floor", design:0, upload:null, w:180, h:120 };

/* ---------- design canvas ---------- */
function designCanvas(){
  const max = 2048, ratio = S.w/S.h;
  const cw = ratio >= 1 ? max : Math.round(max*ratio), ch = ratio >= 1 ? Math.round(max/ratio) : max;
  const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
  const c = cv.getContext("2d");
  if(S.design === "upload" && S.upload){
    const im = S.upload, r = Math.max(cw/im.width, ch/im.height);
    c.drawImage(im, (cw-im.width*r)/2, (ch-im.height*r)/2, im.width*r, im.height*r);
  } else {
    SAMPLES[S.kind][S.design].draw(c, cw, ch);
  }
  return cv;
}

/* ---------- build a real-size 3D model and export as GLB ---------- */
async function buildGlb(){
  const W = S.w/100, H = S.h/100;                // metres
  const scene = new THREE.Scene();
  const tex = new THREE.CanvasTexture(designCanvas());
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const mat = new THREE.MeshStandardMaterial({ map:tex, roughness:.85, metalness:0 });
  if(S.kind === "floor"){
    const geo = new THREE.BoxGeometry(W, .003, H);   // thin sheet lying on the floor
    const side = new THREE.MeshStandardMaterial({ color:0xdddddd, roughness:.9 });
    const sheet = new THREE.Mesh(geo, [side,side,mat,side,side,side]);
    sheet.position.y = .0015; scene.add(sheet);
  } else {
    const cloth = new THREE.Mesh(new THREE.PlaneGeometry(W, H), mat);
    cloth.position.set(0, 0, .012); scene.add(cloth);
    const back = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshStandardMaterial({ color:0xe8e4da, roughness:.95 }));
    back.rotation.y = Math.PI; back.position.set(0,0,.011); scene.add(back);
    const wood = new THREE.MeshStandardMaterial({ color:0x8a5a33, roughness:.6 });
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(.012,.012, W+.08, 24), wood);
    rod.rotation.z = Math.PI/2; rod.position.set(0, H/2+.01, .02); scene.add(rod);
    const bottom = rod.clone(); bottom.position.y = -H/2-.008; scene.add(bottom);
    const cordMat = new THREE.MeshStandardMaterial({ color:0x2a2a2a, roughness:.8 });
    for(const sx of [-1,1]){
      const cord = new THREE.Mesh(new THREE.CylinderGeometry(.002,.002, Math.hypot(W/2, .14), 8), cordMat);
      cord.position.set(sx*W/4, H/2+.08, .02); cord.rotation.z = sx*Math.atan2(W/2,.14); scene.add(cord);
    }
  }
  const exporter = new GLTFExporter();
  const glb = await exporter.parseAsync(scene, { binary:true, maxTextureSize:2048 });
  tex.dispose();
  return new Blob([glb], { type:"model/gltf-binary" });
}

let currentUrl = null, currentBlob = null, token = 0;
async function refresh(){
  const my = ++token;
  const blob = await buildGlb();
  if(my !== token) return;
  if(currentUrl) URL.revokeObjectURL(currentUrl);
  currentBlob = blob; currentUrl = URL.createObjectURL(blob);
  mv.setAttribute("ar-placement", S.kind === "floor" ? "floor" : "wall");
  mv.setAttribute("camera-orbit", S.kind === "floor" ? "0deg 50deg auto" : "0deg 80deg auto");
  mv.alt = S.kind === "floor" ? "床シートの3Dプレビュー" : "タペストリーの3Dプレビュー";
  mv.src = currentUrl;
  $("dimText").textContent = `${S.w} × ${S.h} cm`;
}
let timer; const refreshSoon = () => { clearTimeout(timer); timer = setTimeout(refresh, 250); };

/* ---------- UI ---------- */
function renderDesigns(){
  const box = $("designs"); box.innerHTML = "";
  const list = SAMPLES[S.kind].map((d,i)=>({label:d.name, key:i}));
  if(S.upload) list.push({label:"読み込んだ画像", key:"upload"});
  for(const item of list){
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", String(S.design === item.key));
    const th = document.createElement("canvas"); th.width = 240; th.height = 240;
    const c = th.getContext("2d");
    if(item.key === "upload"){ const im=S.upload, r=Math.max(240/im.width,240/im.height); c.drawImage(im,(240-im.width*r)/2,(240-im.height*r)/2,im.width*r,im.height*r); }
    else { const ratio = S.kind==="floor" ? 1.5 : 2/3, tw = ratio>=1?240:240*ratio, thh = ratio>=1?240/ratio:240;
           c.fillStyle="#e4e8f1"; c.fillRect(0,0,240,240); c.save(); c.translate((240-tw)/2,(240-thh)/2);
           c.beginPath(); c.rect(0,0,tw,thh); c.clip(); SAMPLES[S.kind][item.key].draw(c,tw,thh); c.restore(); }
    const label = document.createElement("span"); label.textContent = item.label;
    b.append(th,label);
    b.addEventListener("click", () => {
      S.design = item.key;
      if(item.key !== "upload" && $("lock").checked){ /* keep current size for samples */ }
      if(item.key === "upload") fitToImage();
      renderDesigns(); refreshSoon();
    });
    box.append(b);
  }
}
function renderPresets(){
  const box = $("presets"); box.innerHTML = "";
  for(const [w,h] of PRESETS[S.kind]){
    const b = document.createElement("button"); b.textContent = `${w}×${h}`;
    b.addEventListener("click", () => { setSize(w,h); refreshSoon(); });
    box.append(b);
  }
}
function setSize(w,h){ S.w = Math.round(w); S.h = Math.round(h); $("wcm").value = S.w; $("hcm").value = S.h; }
function fitToImage(){
  if(!S.upload || !$("lock").checked) return;
  setSize(S.w, S.w * S.upload.height / S.upload.width);
}

$("kindSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  S.kind = b.dataset.v;
  $("kindSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x===b)));
  if(S.design !== "upload") S.design = 0;
  const [w,h] = PRESETS[S.kind][0]; setSize(w,h); fitToImage();
  renderDesigns(); renderPresets(); refreshSoon();
});
$("wcm").addEventListener("input", e => {
  const v = Math.max(10, Math.min(1000, +e.target.value || 10)); S.w = v;
  if(S.design==="upload" && S.upload && $("lock").checked){ S.h = Math.round(v*S.upload.height/S.upload.width); $("hcm").value = S.h; }
  refreshSoon();
});
$("hcm").addEventListener("input", e => {
  const v = Math.max(10, Math.min(1000, +e.target.value || 10)); S.h = v;
  if(S.design==="upload" && S.upload && $("lock").checked){ S.w = Math.round(v*S.upload.width/S.upload.height); $("wcm").value = S.w; }
  refreshSoon();
});
$("upload").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const im = new Image();
  im.onload = () => { S.upload = im; S.design = "upload"; fitToImage(); renderDesigns(); refreshSoon(); };
  im.src = URL.createObjectURL(f);
});
document.querySelector('label[for="upload"]').addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("upload").click(); } });
$("saveGlb").addEventListener("click", () => {
  if(!currentBlob) return;
  const a = document.createElement("a"); a.href = URL.createObjectURL(currentBlob);
  a.download = `${S.kind==="floor"?"floor-sheet":"tapestry"}_${S.w}x${S.h}cm.glb`; a.click();
});

/* AR availability note */
mv.addEventListener("load", () => {
  if(mv.canActivateAR){ $("arNote").innerHTML = "<strong>ARで置けます</strong>赤いボタンを押し、床や壁にカメラを向けてゆっくり動かしてください。面が認識されると実寸で表示されます。"; }
});
mv.addEventListener("ar-status", e => {
  if(e.detail.status === "failed") $("arNote").innerHTML = "<strong>ARを開始できませんでした</strong>周りを明るくして、模様のある床や壁にカメラを向け直してください。";
});

/* QR for opening on a phone (only meaningful when hosted on https) */
if(location.protocol === "https:" && window.qrcode && !/Android|iPhone|iPad/i.test(navigator.userAgent)){
  const qr = qrcode(0, "M"); qr.addData(location.href); qr.make();
  $("qr").innerHTML = qr.createSvgTag({ cellSize:4, margin:2, scalable:true });
  $("qrBox").hidden = false;
}

renderDesigns(); renderPresets(); refresh();
</script>
</body>
</html>
